name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: |
          node --check rules.js
          node --check engine-v22.js
          node --check app.js
          node --check benefits.js
          node --check tests/browser.test.cjs
          node --check tests/engine.test.cjs
          node --check tests/benefits.test.cjs
          node --check tests/merchant-v24.test.cjs
          python -m json.tool data/benefits.json > /dev/null
          python -m json.tool data/check-status.json > /dev/null
          python scripts/check_benefits.py --self-test
      - name: Reward calculation tests
        run: node --test tests/rules.test.cjs tests/engine.test.cjs tests/benefits.test.cjs tests/merchant-v24.test.cjs
      - name: Install browser test dependency
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Phone and tablet smoke tests
        run: node tests/browser.test.cjs
      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardfox-ui-screenshots
          path: tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload inspectable source for QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardfox-source-qa
          path: |
            index.html
            styles.css
            rules.js
            engine-v22.js
            tight-v22.css
            rights.css
            benefits.js
            tests/merchant-v24.test.cjs
            data/benefits.json
            data/check-status.json
            app.js
            favicon.svg
            tests/*.cjs
          if-no-files-found: error
          retention-days: 3
