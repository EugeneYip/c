name: Bank rights monitoring
on:
  schedule:
    - cron: "17 1 * * *" # 09:17 Taipei, every day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/benefits.json
      - scripts/check_benefits.py
      - .github/workflows/check-benefits.yml
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test monitoring parser without network access
        run: python scripts/check_benefits.py --self-test
      - name: Inspect six official public sources
        run: python scripts/check_benefits.py
      - name: Commit only public monitoring snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/check-status.json data/check-baselines.json
          if ! git diff --cached --quiet; then
            git commit -m "data: monitor official credit-card benefit updates [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save inspection record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benefit-monitor-record
          path: |
            data/check-status.json
            data/check-baselines.json
          if-no-files-found: ignore
          retention-days: 14
